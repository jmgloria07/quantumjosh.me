  - "Create games and take turns, with an authorization rule that only a game's players can act on it."
  - "Entity Framework Core persistence with migrations, global exception handling and Swagger docs."
  stack: ["C#", "ASP.NET Core", "Entity Framework Core", "JWT", "Swagger"]
  repos:
  - label: GitHub
    url: https://github.com/jmgloria07/ASPNetCoreMastersTicTacToeGame


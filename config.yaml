baseURL: https://quantumjosh.me
locale: en-us
# Site name: navbar brand, og:site_name and the WebSite structured data.
# The page <title> comes from data/en/site.yaml (seo.title).
title: "Quantum Josh"

module:
  imports:
  - path: github.com/hugo-toha/toha/v4
    # Everything from the theme except its example `content` (posts, notes, search),
    # which this one-page site doesn't use and would otherwise publish and list in the sitemap.
    mounts:
    - source: layouts
      target: layouts
    - source: assets
      target: assets
    - source: data
      target: data
    - source: i18n
      target: i18n
    - source: static
      target: static
    - source: archetypes
      target: archetypes
  mounts:
  - source: assets
    target: assets
  - source: layouts
    target: layouts
  - source: data
    target: data
  - source: archetypes
    target: archetypes
  - source: static
    target: static
  # Font files referenced by the theme's Mulish @font-face rules.
  - source: ./node_modules/@fontsource/mulish/files
    target: static/files
  # Font Awesome SVGs, inlined at build time by layouts/partials/icon.html (no icon JS shipped).
  - source: ./node_modules/@fortawesome/fontawesome-free/svgs
    target: assets/vendor/fontawesome

languages:
  en:
    label: English
    weight: 1

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML

# Only the homepage and 404 page exist; skip taxonomy pages.
disableKinds:
  - taxonomy
  - term
  - RSS

enableRobotsTXT: true

sitemap:
  changefreq: monthly
  priority: 1.0

enableEmoji: true

params:
  logo:
    main: /images/author/josh.png
    inverted: /images/author/josh.png
    favicon: /images/author/josh.png

  gitRepo: https://github.com/jmgloria07/quantumjosh.me
  gitBranch: master

  topNavbar:
    maxVisibleSections: 5

  # Theme features. Each one is listed explicitly: the theme's JS bundler only drops
  # the code for a feature (KaTeX, Plyr, highlight.js, ...) when it is set to false.
  features:
    portfolio:
      enable: true
    theme:
      enable: true
      services:
        light: true
        dark: true
        default: system
    darkMode:
      enable: false
    blog:
      enable: false
    notes:
      enable: false
    comment:
      enable: false
    analytics:
      enable: false
    support:
      enable: false
    toc:
      enable: false
    tags:
      enable: false
    flags:
      enable: false
    embedpdf:
      enable: false
    flowchart:
      enable: false
    math:
      enable: false
    syntaxHighlight:
      enable: false
    videoPlayer:
      enable: false
    readingTime:
      enable: false
    # Structured data is emitted by layouts/partials/seo/structured-data.html instead.
    structuredData:
      enable: false

  footer:
    enable: true
    # Site-owned footer (layouts/partials/site-footer.html).
    template: site-footer.html
